name: Stage Build and Main Deploy Signal

on:
  push:
    branches:
      - stage

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate build and publish work
        run: |
          echo "Starting fake build for stage commit ${GITHUB_SHA}"
          echo "Creating containers now"
          echo "Publishing containers now"
          echo "Build/publish simulation complete"

      - name: Create or reuse PR into main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list \
            --base main \
            --head "${SOURCE_REF}" \
            --state open \
            --json number \
            --jq 'first(.[] | .number) // empty')"

          if [ -n "${existing_pr}" ]; then
            echo "PR #${existing_pr} from ${SOURCE_REF} to main already exists."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${SOURCE_REF}" \
            --title "Promote ${SOURCE_REF} to main" \
            --body "$(cat <<EOF
          Automated PR created after workflow validation completed for \`${SOURCE_REF}\`.

          - Source commit: \`${SOURCE_SHA}\`
          - Workflow run: #${RUN_NUMBER}
          - Workflow URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}
          EOF
          )"
