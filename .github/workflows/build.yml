name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and validate Docker Compose stack
        run: docker compose pull --quiet

      - name: Notify Komodo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -d '{"event":"deploy","repo":"${{ github.repository }}","ref":"${{ github.ref }}","sha":"${{ github.sha }}"}' \
            http://iotkomodopoc.westus2.cloudapp.azure.com:9120/listener/github/stack/christeststack_deployworkflowautomation/deploy
