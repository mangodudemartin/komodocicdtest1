version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Edge AI Detection Stack
#
# Services:
#   mosquitto      – Eclipse Mosquitto MQTT broker (data bus)
#   mock-inference – Simulated video AI detection → publishes to detections/raw
#   alert-filter   – Redpanda Connect pipeline that reads detections/raw and
#                    forwards actionable alerts (confidence ≥ 0.75) to alerts
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MQTT Broker ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health/check", "-m", "ping", "-q", "0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mock Inference Container ─────────────────────────────────────────────────
  mock-inference:
    build:
      context: ./mock-inference
      dockerfile: Dockerfile
    container_name: mock-inference
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_PUBLISH_TOPIC: detections/raw
      PUBLISH_INTERVAL_SECONDS: "3"
      ALERT_CONFIDENCE_THRESHOLD: "0.75"
      CAMERA_ID: cam-01

  # ── Redpanda Connect Alert Filter ────────────────────────────────────────────
  alert-filter:
    image: docker.redpanda.com/redpandadata/connect:4.44.0
    container_name: alert-filter
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./redpanda-connect/pipeline.yaml:/connect.yaml:ro
    command: ["run", "/connect.yaml"]

volumes:
  mosquitto-data:
